name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q iss_tracker.py test
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag iss-tracker:test .
      - name: Verify container startup and health
        run: |
          docker run --detach --name iss-tracker-test --publish 5000:5000 iss-tracker:test
          trap 'docker logs iss-tracker-test; docker rm --force iss-tracker-test' EXIT
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:5000/health
